name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release executor safety boundary
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/release-signed-apk.py scripts/test_release_signed_apk.py
          python3 -m unittest scripts/test_release_signed_apk.py
          bash -n scripts/run-release-signed-apk.sh
          docker build --pull=false -q -t hypershell/mobilerun-portal-release-executor:android35-sdk34-v1 tools/release-executor >/dev/null
          docker run --rm hypershell/mobilerun-portal-release-executor:android35-sdk34-v1 \
            python3 -c 'import bitwarden_sdk; from bitwarden_secrets_manager_mcp.config import Settings; from bitwarden_secrets_manager_mcp.provider import SdkProvider'
          docker run --rm hypershell/mobilerun-portal-release-executor:android35-sdk34-v1 \
            bash -lc 'command -v keytool >/dev/null; command -v apkanalyzer >/dev/null; test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"'

      - name: Verify unit tests
        env:
          HYPERSHELL_GRADLE_CACHE: ${{ runner.temp }}/mobilerun-gradle-cache
        run: ./scripts/verify-hypershell.sh tests

      - name: Verify debug APK contract
        env:
          HYPERSHELL_GRADLE_CACHE: ${{ runner.temp }}/mobilerun-gradle-cache
        run: ./scripts/verify-hypershell.sh apk

      - name: Android lint
        env:
          HYPERSHELL_GRADLE_CACHE: ${{ runner.temp }}/mobilerun-gradle-cache
        run: |
          set -euo pipefail
          docker build --pull=false -q -t hypershell/mobilerun-portal-builder:android35-sdk34-v1 tools/android-builder >/dev/null
          mkdir -p "$HYPERSHELL_GRADLE_CACHE"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/home -e GRADLE_USER_HOME=/gradle-cache \
            -v "$PWD:/work" -v "$HYPERSHELL_GRADLE_CACHE:/gradle-cache" -w /work \
            hypershell/mobilerun-portal-builder:android35-sdk34-v1 \
            bash -lc 'mkdir -p "$HOME" && ./gradlew :app:lintAnalyzeDebug :app:lintReportDebug -Pkotlin.compiler.execution.strategy=in-process --no-daemon'

      - name: Trivy source gate
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.74.0 fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs /src/app/build \
            --skip-dirs /src/.gradle \
            /src

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobilerun-portal-hypershell-debug
          path: app/build/outputs/apk/debug/eu.hypershell.mobilerun.portal-0.7.25-hypershell.1-debug.apk
          if-no-files-found: error
          retention-days: 7
